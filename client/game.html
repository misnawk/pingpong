<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏓 Ping Pong - 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Waiting screen -->
  <div id="waitingScreen" class="waiting-screen hidden">
    <div class="card waiting-card">
      <h2>상대방을 기다리는 중...</h2>
      <p>방 코드를 친구에게 알려주세요!</p>
      <div id="roomCodeDisplay" class="room-code">------</div>
      <p class="hint">상대방이 이 코드로 입장하면 자동으로 게임이 시작됩니다.</p>
    </div>
  </div>

  <!-- Game screen -->
  <div id="gameScreen" class="game-screen hidden">
    <div class="scoreboard">
      <div class="player-info left">
        <span id="leftNickname" class="nickname">-</span>
        <span id="leftScore" class="score">0</span>
      </div>
      <div class="divider">:</div>
      <div class="player-info right">
        <span id="rightScore" class="score">0</span>
        <span id="rightNickname" class="nickname">-</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <!-- Game over overlay -->
      <div id="gameOverOverlay" class="game-over-overlay hidden">
        <div class="game-over-card">
          <h2 id="gameOverTitle">게임 종료</h2>
          <p id="gameOverMsg"></p>
          <button id="restartBtn" class="btn btn-primary">다시 시작</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Disconnected screen -->
  <div id="disconnectedScreen" class="waiting-screen hidden">
    <div class="card waiting-card">
      <h2>연결이 끊겼습니다</h2>
      <p>상대방이 게임을 나갔습니다.</p>
      <button id="backToLobbyBtn" class="btn btn-secondary" onclick="location.href='/'">로비로 돌아가기</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
